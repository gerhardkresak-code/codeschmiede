[package]
name = "codeschmiede"
version = "0.1.0"
description = "Codeschmiede – Programmierumgebung für alle Apps (Auftrags-Zentrale und Werkstatt)"
authors = ["Gerhard Kresak"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# API-Schlüssel im Tresor: Windows-Anmeldeinformationsverwaltung (DPAPI) bzw. Mac-Schlüsselbund – nur dieser Benutzer
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
