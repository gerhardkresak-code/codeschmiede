name: Prüfung
# Bei jedem Zweig und Pull Request: Tests des Programms (auf Windows, ohne Linux-Systempakete). Grundgerüst aus der Codeschmiede.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - run: npx --yes @tauri-apps/cli@^2 icon app-icon.png
      - run: cargo test --manifest-path src-tauri/Cargo.toml
