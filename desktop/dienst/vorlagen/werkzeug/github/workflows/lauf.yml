name: Lauf
# Führt das Werkzeug aus und legt das Ergebnis (Ordner ausgabe/) als Datei ab. Start per Knopf in der Codeschmiede.
# Zeitplan: die zwei Zeilen unter „schedule“ einkommentieren (Zeiten in UTC).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 5 * * *"
permissions:
  contents: read
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm start
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ergebnis, path: ausgabe/, retention-days: 30, if-no-files-found: ignore }
