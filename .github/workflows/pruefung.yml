name: Prüfung

# Baut die Oberfläche und prüft Werkstatt-Dienst und Programm. Pflicht für jeden Pull Request nach main.
on:
  push:
    branches: ['feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04   # fest: „ubuntu-latest“ wechselt seit 19.10.2026 auf Ubuntu 26, dort hing die Paket-Installation
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Oberfläche bauen
        env:
          VITE_SUPABASE_URL: https://mvzlbpijdvsjnemubofy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: pruefung
        run: npm run build
  dienst:
    runs-on: ubuntu-24.04   # fest: „ubuntu-latest“ wechselt seit 19.10.2026 auf Ubuntu 26, dort hing die Paket-Installation
    timeout-minutes: 20
    defaults: { run: { working-directory: desktop/dienst } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Syntax und Tests
        run: |
          node --check index.mjs
          for f in lib/*.mjs; do node --check "$f"; done
          npm test
  programm:
    runs-on: ubuntu-24.04   # fest: „ubuntu-latest“ wechselt seit 19.10.2026 auf Ubuntu 26, dort hing die Paket-Installation
    timeout-minutes: 20
    defaults: { run: { working-directory: desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Programm-Symbole erzeugen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon app-icon.png
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri -> target }
      - name: Systembibliotheken für Tauri (Linux-Prüfung)
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Paket-Server antworten zeitweise nicht (Prüfung hing 2026-10-22 mehrfach): kurze Zeitlimits + bis zu 3 Versuche
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for v in 1 2 3; do
            sudo -E apt-get $A update && sudo -E apt-get $A install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev && exit 0
            echo "Versuch $v fehlgeschlagen, neuer Versuch …"; sleep 10
          done
          exit 1
      - name: Programm prüfen (Tests)
        run: cargo test --release
