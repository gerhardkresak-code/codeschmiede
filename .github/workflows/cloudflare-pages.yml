name: Cloudflare Pages

# Baut die Oberfläche (web/) und lädt sie zu Cloudflare Pages (Projekt „codeschmiede“) hoch – Anweisung Gerhard 2026-10-25 20:39.
# Grund: Seit dem Umzug nach kresak-it-solutions baut Cloudflare das Repository nicht mehr selbst (Pages-Projekt fest mit
# gerhardkresak-code/codeschmiede verknüpft). Projekt und Adresse bleiben gleich – das installierte Programm startet weiter
# https://codeschmiede.pages.dev/ (Zweig „main“ = Produktion, andere Zweige = <zweig>.codeschmiede.pages.dev).
# Die Werkstatt erkennt diesen Ablauf am Datei-Pfad (desktop/dienst/lib/live.mjs) – Datei bitte nicht umbenennen.
# Geheimnis: CLOUDFLARE_API_TOKEN (nur „Cloudflare Pages: Bearbeiten“) – dasselbe wie für codeschmiede-updates (programm.yml).
on:
  push:
    branches: ["**", "!version/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bauen
        run: npm install --no-audit --no-fund && npm run build
      - name: Zu Cloudflare Pages hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a20e5ea4c61fb0156e241c29f99fac93
          NACHRICHT: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Geheimnis CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          tok=$(printf '%s\n' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'length($0)>=38 && $0 !~ /[[:space:]]/ {print; exit}')
          [ -n "$tok" ] || { echo "::error::CLOUDFLARE_API_TOKEN enthält keinen gültigen Schlüssel – bitte neu einfügen"; exit 1; }
          export CLOUDFLARE_API_TOKEN="$tok"
          msg=$(printf '%s' "${NACHRICHT:-Bau aus GitHub}" | head -n1 | cut -c1-300)
          npx --yes wrangler@4 pages deploy dist --project-name codeschmiede --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" --commit-message "$msg" --commit-dirty=true
